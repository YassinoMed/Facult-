<!doctype html>
<html lang="fr" class="motion-prep">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harnais mouvement étudiant</title>
    <link rel="stylesheet" href="/build/assets/app-DEaK-ik1.css">
    <link rel="stylesheet" href="/build/assets/lenis-fOJvfYOR.css">
    <style>
        body { margin: 0; }
        main { min-height: 250vh; padding: 2rem; }
        .ds-card, .form-card { background: #fff; border: 1px solid #cbd5e1; border-radius: 1rem; padding: 2rem; margin: 2rem 0; }
        .form-card { border-radius: 1.5rem; }
        .below { margin-top: 120vh; }
        h1 { font-size: 2rem; margin: 0 0 1rem; }
    </style>
</head>
<body data-motion="etudiant">
<main id="contenu">
    <h1>Bonjour Étudiant Test</h1>
    <p>Bienvenue dans votre espace.</p>

    <section aria-labelledby="titre-carte" class="ds-card">
        <h2 id="titre-carte">Aujourd'hui</h2>
        <p>Contenu de la carte visible.</p>
    </section>

    <div class="form-card" id="carte-formulaire">
        <h2>Prendre rendez-vous</h2>
        <form id="formulaire">
            <label for="champ">Nom</label>
            <input id="champ" value="Test">
            <button type="submit">Envoyer</button>
        </form>
    </div>

    <section aria-labelledby="titre-bas" class="ds-card below">
        <h2 id="titre-bas">Bloc bas</h2>
        <p>Révélé au défilement.</p>
    </section>
</main>

<script type="module" src="/build/assets/etudiant-DVMNHQtz.js"></script>
</body>
</html>
